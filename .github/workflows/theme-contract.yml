name: Theme contract check

# Verifies this site's renditions against the One Bit Forest catalogue that the
# arda.tr repo publishes as config/themes.json (contract v3): the id set, the
# roles and the required tokens — never the values. Soft-passes while arda.tr
# main still publishes an older contract. Runs as a separate workflow so it
# never blocks deploys.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Run JavaScript actions on Node 24 (matches deploy.yml).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Check renditions against the shared catalogue
        run: node scripts/check-theme-contract.mjs
