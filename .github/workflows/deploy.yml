name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main # Or your default branch if different
  # Pull requests build and test; only main deploys.
  pull_request:
  workflow_dispatch: # Allows manual triggering

# Read-only by default; the deploy job alone gets the Pages and OIDC scopes.
permissions:
  contents: read

# Run JavaScript actions on Node 24, GitHub's default since June 2026. Kept
# explicit so an action that still declares Node 20 runs on 24 as well.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read # configure-pages reads the Pages site
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24' # Matches the arda.tr portfolio build
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Test static output and browser boundaries
        run: npm run test:static
      - name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6
      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          # Upload entire repository
          path: './dist/client' # This is where your static site is generated

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    # Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
    # However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
    # Job-level, so pull-request builds never queue behind (or cancel) a deployment.
    concurrency:
      group: "pages"
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
