    <!--
      Rendition + language bootstrap. Blocking on purpose: without it a reader
      who chose a dark rendition gets a full flash of paper before React
      mounts, and screen readers announce Japanese and Turkish content as
      English until the first render.

      Stored ids from earlier designs migrate by role (light → xerox,
      HC light → xerox-hc, dark → night, HC dark → night-hc) and the migrated
      id is written back. Keep in sync with ThemeContext.res.
    -->
    <script>
      (function () {
        var root = document.documentElement;
        var RENDITIONS = { xerox: 0, "xerox-hc": 0, night: 1, "night-hc": 1 };
        var LEGACY = {
          ruled: "xerox", alucard: "xerox", light: "xerox",
          "ruled-hc": "xerox-hc", paper: "xerox-hc", "light-hc": "xerox-hc",
          "carbon-copy": "night", "van-helsing": "night", dracula: "night", dark: "night",
          "carbon-copy-hc": "night-hc", carbon: "night-hc", "dark-hc": "night-hc"
        };
        // Storage can throw (blocked site data, some private modes). Theme and
        // language are read separately so one failure cannot cost the other,
        // and a failed read still paints the default rendition.
        var own = function (o, k) { return !!k && Object.prototype.hasOwnProperty.call(o, k); };
        var t = null;
        try {
          t = localStorage.getItem("resume-theme");
          if (own(LEGACY, t)) {
            t = LEGACY[t];
            try { localStorage.setItem("resume-theme", t); } catch (e) {}
          }
        } catch (e) {
          t = null;
        }
        if (!own(RENDITIONS, t)) t = "xerox";
        root.classList.add(t);
        if (RENDITIONS[t]) root.classList.add("dark");
        root.style.colorScheme = RENDITIONS[t] ? "dark" : "light";
        try {
          var l = localStorage.getItem("resume-lang");
          if (l === "en" || l === "ja" || l === "tr") root.lang = l;
        } catch (e) {}
      })();
    </script>
