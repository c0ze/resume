    <!--
      Language bootstrap. Blocking on purpose: without it screen readers
      announce Japanese and Turkish content as English until the first render.
      The scheme needs no script: the page is light only (data-theme="light"
      on <html>, see DESIGN.md).
    -->
    <script>
      (function () {
        // Storage can throw (blocked site data, some private modes).
        try {
          var l = localStorage.getItem("resume-lang");
          if (l === "en" || l === "ja" || l === "tr") document.documentElement.lang = l;
        } catch (e) {}
      })();
    </script>
