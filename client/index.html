    <!--
      Rendition + language bootstrap. Blocking on purpose: without it a reader
      who chose a dark rendition gets a full flash of light stock before React
      mounts, and screen readers announce Japanese and Turkish content as
      English until the first render. Both were live defects.
    -->
    <script>
      (function () {
        var root = document.documentElement;
        var RENDITIONS = { ruled: 0, "ruled-hc": 0, "carbon-copy": 1, "carbon-copy-hc": 1 };
        try {
          var t = localStorage.getItem("resume-theme");
          if (!(t in RENDITIONS)) t = "ruled";
          root.classList.add(t);
          if (RENDITIONS[t]) {
            root.classList.add("dark");
            root.style.colorScheme = "dark";
          } else {
            root.style.colorScheme = "light";
          }
          var l = localStorage.getItem("resume-lang");
          if (l === "en" || l === "ja" || l === "tr") root.lang = l;
        } catch (e) {
          root.classList.add("ruled");
        }
      })();
    </script>

    <!--

    <link
